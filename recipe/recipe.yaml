schema_version: 1

context:
  name: flwr
  version: "1.33.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/flwr-${{ version }}.tar.gz
  sha256: d02b4a922dc54fc6b8d970195819bbe96056e0aca2acf08958cc7eb621f30d06

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - flwr = flwr.cli.app:app
      - flwr-simulation = flwr.simulation.app:flwr_simulation
      - flower-superlink = flwr.superlink.cli:flower_superlink
      - flower-supernode = flwr.supernode.cli:flower_supernode
      - flower-superexec = flwr.supercore.cli:flower_superexec
      - flwr-serverapp = flwr.superlink.cli:flwr_serverapp
      - flwr-clientapp = flwr.supernode.cli:flwr_clientapp
      - flwr-agentapp = flwr.supercore.cli:flwr_agentapp
      - flwr-model = flwr.supercore.cli:flwr_model
      - flwr-connector = flwr.supercore.cli:flwr_connector

requirements:
  host:
    - pip
    - uv-build >=0.11.15,<0.12
    - python ${{ python_min }}.*
  run:
    # There is some snafu with grpcio version availability on Conda, removing some pinning and hoping for the best...
    # Upstream also using some unconventional Protobuf version numbers...
    - python >=${{ python_min }}
    - numpy >=1.26.0,<3.0.0
    - grpcio >=1.70.0,<2.0.0
    - grpcio-health-checking >=1.70.0,<2.0.0
    - protobuf >=5.28.0,<7.0.0
    - cryptography >=46.0.7,<47.0.0
    - pycryptodome >=3.18.0,<4.0.0
    - iterators >=0.0.2,<0.0.3
    - typer >=0.13.0,<0.21.0
    - python-uv >=0.11.15,<0.12.0
    - tomli >=2.0.1,<3.0.0
    - tomli-w >=1.0.0,<2.0.0
    - pathspec >=1.0.4,<2.0.0
    - prompt-toolkit >=3.0.52,<4.0.0
    - rich >=14.0.0,<15.0.0
    - pyyaml >=6.0.2,<7.0.0
    - requests >=2.33.0,<3.0.0
    - click >=8.0.0,<9.0.0
    - packaging >=24.0,<26.0
    - sqlalchemy >=2.0.45,<3.0.0
    - alembic >=1.18.1,<2.0.0
    - uvicorn-standard >=0.49.0,<0.50.0
    - fastapi >=0.138.0,<0.139.0
    - starlette >=1.3.1,<1.4.0
    # From sqlalchemy[asyncio]
    - greenlet >=1

tests:
  - python:
      imports:
        - flwr
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - ray-core
        - python ${{ python_min }}.*
    script:
      - flwr --help
      - flwr-simulation --help
      - flower-superlink --help
      - flower-supernode --help
      - flower-superexec --help
      - flwr-serverapp --help
      - flwr-clientapp --help
      - flwr-agentapp --help
      - flwr-model --help
      - flwr-connector --help

about:
  summary: Flower - A Friendly Federated Learning Framework
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://flower.ai
  repository: https://github.com/adap/flower
  documentation: https://flower.ai/docs/

extra:
  recipe-maintainers:
    - tanertopal
    - danieljanes
    - flwrmachine
    - thewchan
